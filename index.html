<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أبو علي</title>
<style>
:root{
  --bg:#080f2b; --panel:#0d1739; --panel2:#132048; --line:#1e2e63;
  --txt:#e9edfb; --dim:#8b99c4; --acc:#c9a24b; --acc2:#e6cb84;
  --user:#1a2a5e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 50% -10%,#12245e 0%,#080f2b 60%) fixed,var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

header{height:56px;flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:0 14px;
  border-bottom:1px solid var(--line);background:rgba(10,20,52,.92);backdrop-filter:blur(12px)}
.logo{width:28px;height:28px;display:grid;place-items:center}
.logo img,.hero .big img,.av img{display:block;width:100%;height:100%;object-fit:contain}
.htitle{font-weight:600;font-size:15.5px;line-height:1.15}
.hsub{font-size:11px;color:var(--dim);margin-top:1px}
.spacer{flex:1}
.iconbtn{width:35px;height:35px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--txt);font-size:15px;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:#1c2c63}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#3ddc84;
  margin-inline-end:5px;vertical-align:middle}
.dot.off{background:#e05a5a}

main{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:22px 0 10px}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* ── فارغ / ترحيب ── */
.hero{text-align:center;padding:46px 0 26px}
.hero .big{width:64px;height:64px;margin:0 auto 16px;display:grid;place-items:center;filter:drop-shadow(0 8px 20px rgba(47,97,201,.4))}
.hero h1{font-size:22px;margin:0 0 8px;font-weight:600}
.hero p{margin:0;color:var(--dim);font-size:14px}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
@media(max-width:560px){.cards{grid-template-columns:1fr}}
.card{text-align:start;padding:14px 15px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);cursor:pointer;font-family:inherit;transition:.15s}
.card:active,.card:hover{border-color:var(--acc)}
.card b{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.card span{font-size:11.5px;color:var(--dim)}

/* ── رسائل ── */
.row{display:flex;gap:11px;margin-bottom:22px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse}
.av{flex:0 0 auto;width:26px;height:26px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:13px;background:transparent;border:0}
.row.me .av{background:var(--user);border-color:#2b3f7d}
.bub{max-width:100%;font-size:15px;line-height:1.9;padding-top:3px}
.row.me .bub{background:var(--user);border:1px solid #2b3f7d;padding:10px 14px;border-radius:14px;max-width:82%}
.who{font-size:11px;color:var(--dim);margin-bottom:3px}
.bub p{margin:0 0 11px}.bub p:last-child{margin:0}
.bub strong{color:var(--acc2)}
.bub ul{margin:7px 0;padding-inline-start:20px}
.bub li{margin-bottom:6px}
.bub code{background:#04091f;padding:2px 6px;border-radius:5px;font-size:13px;color:var(--acc2)}
.bub pre{background:#04091f;border:1px solid var(--line);border-radius:11px;padding:13px;
  overflow-x:auto;direction:ltr;text-align:left}
.bub pre code{background:none;padding:0;color:#dadae2}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

footer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(10,20,52,.96);
  backdrop-filter:blur(12px);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.comp{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel2);
  border:1px solid var(--line);border-radius:17px;padding:6px}
.comp:focus-within{border-color:var(--acc)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--txt);
  font:15px/1.65 inherit;padding:9px 10px;max-height:150px;min-height:24px}
textarea::placeholder{color:#6879ab}
.send{width:39px;height:39px;flex:0 0 auto;border:0;border-radius:12px;cursor:pointer;
  background:var(--acc);color:#0a1434;font-size:17px;display:grid;place-items:center}
.send:disabled{opacity:.3;cursor:default}
.hint{max-width:780px;margin:7px auto 0;font-size:10.5px;color:#5f6d9b;text-align:center}
</style>
</head>

const CHAT_API = 'https://hussein911.app.n8n.cloud/webhook/abu-ali-chat';
/* ════════════════════════════════════════════════════════ */

const stream=document.getElementById('stream'), main=document.getElementById('main'),
      inp=document.getElementById('inp'), send=document.getElementById('send'),
      stat=document.getElementById('stat');
let busy=false, hist=JSON.parse(localStorage.getItem('abuali_chat')||'[]');

const CARDS=[
 ['🏗️ ابنيلي موقع','موقع كامل لمشروعي'],
 ['🎨 صمملي إعلان','تصميم دعائي لمنتج'],
 ['📊 حللي فكرة','دراسة مشروع وخطة'],
 ['📚 اشرحلي موضوع','شرح مبسّط ومفصّل']
];

function md(t){
  let h=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>'<pre><code>'+c.trim()+'</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  return h.split(/\n{2,}/).map(b=>{
    if(/^<pre/.test(b))return b;
    const ls=b.split('\n').filter(l=>l.trim());
    if(ls.length&&ls.every(l=>/^\s*([-*•]|\d+[.)])\s/.test(l)))
      return '<ul>'+ls.map(l=>'<li>'+l.replace(/^\s*([-*•]|\d+[.)])\s*/,'')+'</li>').join('')+'</ul>';
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
const scroll=()=>main.scrollTop=main.scrollHeight;

function add(html,role,raw){
  const r=document.createElement('div'); r.className='row'+(role==='me'?' me':'');
  const av=document.createElement('div'); av.className='av'; if(role==='me')av.textContent='👤';else av.innerHTML=GATE;
  const b=document.createElement('div'); b.className='bub';
  if(role!=='me'){const w=document.createElement('div');w.className='who';w.textContent='أبو علي';b.appendChild(w);}
  const body=document.createElement('div'); body.innerHTML = raw?html:md(html);
  b.appendChild(body); r.append(av,b); stream.appendChild(r); scroll();
  return {row:r,body};
}
const save=()=>localStorage.setItem('abuali_chat',JSON.stringify(hist.slice(-40)));

function render(){
  stream.innerHTML='';
  if(!hist.length){
    const h=document.createElement('div'); h.className='hero';
    h.innerHTML='<div class="big">'+GATE+'</div><h1>هلا بيك سيّدي</h1><p>أبو علي بالخدمة — شنو أمرك اليوم؟</p>';
    const g=document.createElement('div'); g.className='cards';
    CARDS.forEach(([t,s])=>{const c=document.createElement('button');c.className='card';
      c.innerHTML='<b>'+t+'</b><span>'+s+'</span>';
      c.onclick=()=>{inp.value=t.replace(/^\S+\s/,'');go();};g.appendChild(c);});
    h.appendChild(g); stream.appendChild(h); return;
  }
  hist.forEach(m=>add(m.t,m.r==='u'?'me':'a'));
}

async function go(){
  const t=inp.value.trim(); if(!t||busy) return;
  busy=true; send.disabled=true; inp.value=''; inp.style.height='auto';
  const hero=stream.querySelector('.hero'); if(hero)hero.remove();
  add(t,'me'); hist.push({r:'u',t}); save();
  const th=add('<div class="dots"><i></i><i></i><i></i></div>','a',true);
  try{
    const res=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:t,history:hist.slice(-8),general:'gen1'})});
    const d=await res.json();
    const reply=d.reply||d.output||d.text||'⚠️ ما وصلني رد واضح من القيادة.';
    th.body.innerHTML=md(reply); hist.push({r:'a',t:reply}); save();
  }catch(e){ th.body.innerHTML=md('⚠️ خط الاتصال مقطوع — عاود المحاولة سيّدي.'); }
  busy=false; send.disabled=false; scroll(); inp.focus();
}

send.onclick=go;
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,150)+'px'});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>820){e.preventDefault();go();}});
document.getElementById('clr').onclick=()=>{
  if(hist.length&&!confirm('محادثة جديدة؟ الحالية راح تنمسح.'))return;
  hist=[]; save(); render();
};

render();
(async()=>{
  try{
    const r=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:'ping',history:[],general:'gen1',ping:true})});
    stat.innerHTML = r.ok ? '<span class="dot"></span>متصل' : '<span class="dot off"></span>غير متصل';
  }catch(e){ stat.innerHTML='<span class="dot off"></span>غير متصل'; }
