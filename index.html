<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abu Ali Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 text-center text-lg font-bold shadow-md">
        🤖 Abu Ali Agent
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-gray-800 text-gray-200 p-3 rounded-2xl rounded-tr-none max-w-xs md:max-w-md shadow-sm border border-gray-700">
                أهلاً بك! أنا جاهز للتحدث معك، اكتب أي رسالة لتجربتي.
            </div>
        </div>
    </main>

    <!-- Input Bar -->
    <footer class="p-4 bg-gray-800 border-t border-gray-700">
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2 max-w-4xl mx-auto">
            <input 
                type="text" 
                id="user-input" 
                placeholder="اكتب رسالتك هنا..." 
                required 
                autocomplete="off"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            />
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-all disabled:opacity-50"
            >
                إرسال
            </button>
        </form>
    </footer>

    <script>
        const WEBHOOK_URL = "https://hussein911.app.n8n.cloud/webhook/6d47c7e9-bab0-418f-8901-660a06c0709b";

        async function sendMessage(e) {
            e.preventDefault();
            
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const chatContainer = document.getElementById("chat-container");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // 1. إضافة رسالة المستخدم للشاشة
            appendMessage(messageText, 'user');
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            // 2. إنشاء مكان لرد البوت (حالة الانتظار)
            const botMsgElement = appendMessage("جاري التفكير...", 'bot');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatInput: messageText, message: messageText })
                });

                const rawText = await response.text();
                let cleanReply = "";

                // محاولة فك الشفرة إذا كانت JSON
                try {
                    const parsedJson = JSON.parse(rawText);
                    cleanReply = parsedJson.output || parsedJson.text || parsedJson.message || parsedJson.response || JSON.stringify(parsedJson);
                } catch (err) {
                    cleanReply = rawText;
                }

                // إذا وصل كود HTML نقوم بتنظيفه واستخراج النص فقط تلقائياً
                if (typeof cleanReply === 'string' && (cleanReply.includes('<html') || cleanReply.includes('<!DOCTYPE'))) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(cleanReply, 'text/html');
                    cleanReply = doc.body.textContent.trim() || "تم استلام الرد بنجاح.";
                }

                botMsgElement.innerText = cleanReply;

            } catch (error) {
                console.error("Error:", error);
                botMsgElement.innerText = "عذراً، حدث خطأ في الاتصال بالورُك فلو.";
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById("chat-container");
            const wrapper = document.createElement("div");
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgBubble = document.createElement("div");
            if (sender === 'user') {
                msgBubble.className = "bg-blue-600 text-white p-3 rounded-2xl rounded-tl-none max-w-xs md:max-w-md shadow-sm";
            } else {
                msgBubble.className = "bg-gray-800 text-gray-200 p-3 rounded-2xl rounded-tr-none max-w-xs md:max-w-md shadow-sm border border-gray-700 whitespace-pre-wrap";
            }

            msgBubble.innerText = text;
            wrapper.appendChild(msgBubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return msgBubble;
        }
    </script>
</body>
</html>
