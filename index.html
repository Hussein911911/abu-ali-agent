<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abu Ali Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col h-screen">

    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700 p-4 text-center text-lg font-bold shadow-md flex justify-between items-center px-6">
        <span>🤖 Abu Ali Agent</span>
        <span class="text-xs bg-green-500/20 text-green-400 border border-green-500/30 px-2 py-1 rounded-full">متصل</span>
    </header>

    <!-- Chat Messages Container -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex justify-start">
            <div class="bg-gray-800 text-gray-200 p-4 rounded-2xl rounded-tr-none max-w-xs md:max-w-md shadow-sm border border-gray-700">
                أهلاً بك! أنا جاهز للتحدث معك. يمكنك إرسال النصوص أو طلب الوسائط وسأقوم بمعالجتها فوراً.
            </div>
        </div>
    </main>

    <!-- Input Bar -->
    <footer class="p-4 bg-gray-800 border-t border-gray-700">
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2 max-w-4xl mx-auto">
            <input 
                type="text" 
                id="user-input" 
                placeholder="اكتب رسالتك هنا..." 
                required 
                autocomplete="off"
                class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all"
            />
            <button 
                type="submit" 
                id="send-btn"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold transition-all disabled:opacity-50"
            >
                إرسال
            </button>
        </form>
    </footer>

    <script>
        const WEBHOOK_URL = "https://hussein911.app.n8n.cloud/webhook/6d47c7e9-bab0-418f-8901-660a06c0709b";

        async function sendMessage(e) {
            e.preventDefault();
            
            const inputField = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const chatContainer = document.getElementById("chat-container");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // 1. إضافة رسالة المستخدم
            appendMessage(messageText, 'user');
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            // 2. إضافة رسالة انتظار البوت
            const botMsgBubble = appendMessage("جاري التفكير...", 'bot');

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chatInput: messageText, message: messageText })
                });

                const rawText = await response.text();
                let rawHtmlContent = "";
                let cleanReply = "";

                try {
                    const parsedJson = JSON.parse(rawText);
                    rawHtmlContent = parsedJson.html || "";
                    cleanReply = parsedJson.html || parsedJson.output || parsedJson.text || parsedJson.message || parsedJson.response || rawText;
                } catch (err) {
                    cleanReply = rawText;
                }

                // تنظيف كود الـ HTML واستخراج النص المباشر
                let isHtmlDetected = false;
                if (typeof cleanReply === 'string' && (cleanReply.includes('<') || cleanReply.includes('>'))) {
                    isHtmlDetected = true;
                    if (!rawHtmlContent) rawHtmlContent = cleanReply;
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(cleanReply, 'text/html');
                    cleanReply = doc.body.textContent.replace(/\s+/g, ' ').trim() || "تم استلام الرد بنجاح.";
                }

                // مسح نص الانتظار وتفريغ الفقرة لتعبئتها بالشكل الفخم
                botMsgBubble.innerHTML = "";

                // نص الرد الصافي
                const textNode = document.createElement("div");
                textNode.innerText = cleanReply;
                botMsgBubble.appendChild(textNode);

                // أزرار التحكم بالرسالة (نسخ + مشاركة + نسخ HTML)
                addActionBar(botMsgBubble, cleanReply, rawHtmlContent, isHtmlDetected);

            } catch (error) {
                console.error("Error:", error);
                botMsgBubble.innerText = "عذراً، حدث خطأ في الاتصال بالورُك فلو.";
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        function appendMessage(text, sender) {
            const chatContainer = document.getElementById("chat-container");
            const wrapper = document.createElement("div");
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const msgBubble = document.createElement("div");
            if (sender === 'user') {
                msgBubble.className = "bg-blue-600 text-white p-3 rounded-2xl rounded-tl-none max-w-xs md:max-w-md shadow-sm space-y-2";
                msgBubble.innerText = text;
                addActionBar(msgBubble, text, "", false);
            } else {
                msgBubble.className = "bg-gray-800 text-gray-200 p-3 rounded-2xl rounded-tr-none max-w-xs md:max-w-md shadow-sm border border-gray-700 space-y-2 whitespace-pre-wrap";
                msgBubble.innerText = text;
            }

            wrapper.appendChild(msgBubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return msgBubble;
        }

        function addActionBar(bubbleElement, textToCopy, htmlContent, showHtmlBtn) {
            const btnBar = document.createElement("div");
            btnBar.className = "flex flex-wrap gap-2 pt-2 mt-2 border-t border-gray-700/50 text-xs text-gray-300";

            // زر نسخ النص
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "hover:text-blue-400 bg-gray-900/50 px-2 py-1 rounded border border-gray-600 flex items-center gap-1 transition-all";
            copyBtn.innerHTML = "📋 نسخ النص";
            copyBtn.onclick = () => copyToClipboard(textToCopy, copyBtn);
            btnBar.appendChild(copyBtn);

            // زر المشاركة
            if (navigator.share) {
                const shareBtn = document.createElement("button");
                shareBtn.type = "button";
                shareBtn.className = "hover:text-green-400 bg-gray-900/50 px-2 py-1 rounded border border-gray-600 flex items-center gap-1 transition-all";
                shareBtn.innerHTML = "🔗 مشاركة";
                shareBtn.onclick = () => {
                    navigator.share({ title: 'Abu Ali Agent Response', text: textToCopy }).catch(() => {});
                };
                btnBar.appendChild(shareBtn);
            }

            // زر نسخ كود HTML (إذا كان هناك كود HTML)
            if (showHtmlBtn && htmlContent) {
                const copyHtmlBtn = document.createElement("button");
                copyHtmlBtn.type = "button";
                copyHtmlBtn.className = "hover:text-yellow-400 bg-gray-900/50 px-2 py-1 rounded border border-gray-600 flex items-center gap-1 transition-all";
                copyHtmlBtn.innerHTML = "📄 نسخ كود HTML";
                copyHtmlBtn.onclick = () => copyToClipboard(htmlContent, copyHtmlBtn);
                btnBar.appendChild(copyHtmlBtn);
            }

            bubbleElement.appendChild(btnBar);
        }

        function copyToClipboard(content, btnElement) {
            navigator.clipboard.writeText(content).then(() => {
                const originalText = btnElement.innerHTML;
                btnElement.innerHTML = "✅ تم النسخ!";
                setTimeout(() => { btnElement.innerHTML = originalText; }, 2000);
            });
        }
    </script>
</body>
    </html>
